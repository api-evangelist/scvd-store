client_ceiling:
  note: 'The stock @x402/core client applies a default $1 per-payment ceiling BEFORE picking an accept; 14 of 35 doors sit above it. Raise maxAmountPerPayment or pass spendControls: false deliberately — "It is your operator''s safety control and we ship nothing to route around it."'
