summary: >-
  A one-person US LLC (Record Creative Co. LLC, Oak City, North Carolina) that collects almost nothing — no
  accounts, no cookies, no IP logs — and publishes the horizontal signals it does have as JSON pages rather
  than legal boilerplate. Four signals carry real substance and are recorded; the rest are honest absences.
  No accessibility statement, no SBOM, no transparency report, no age signal, no GPC statement and no
  incident-notification commitment were found at any conventional path (all 404) or in the docs. Nothing
  here infers which regime reaches the provider.
