not_found:
  sbom: 'Not published. The repo is public (MIT) with a package-lock.json, but no CycloneDX/SPDX document is served or linked; never derived.'
  accessibility_conformance: No statement or VPAT.
  training_data_summary: 'None. robots.txt states a position on being TRAINED ON (ai-train=yes) — that is a content signal about the site, not a summary of data the provider trained a model on; the provider ships no model.'
  ai_transparency: 'No AI-disclosure page. llms.txt and skill.md describe the keeper as a named human and human-labor items as fulfilled by hand; nothing states whether copy is AI-written.'
  global_privacy_control: 'No published GPC statement (and no cookies or tracking to opt out of, per privacy). Not set from a header probe.'
  data_residency: Not stated; hosted on Cloudflare Workers (global edge) per /stack.
  incident_notification: >-
    No stated notification SLA. security.txt + trust.json standards say disclosure is "private-first and
    symmetric: notify the operator before publication, including our own defects" — a disclosure posture, not
    a customer-notification commitment.
  age_assurance: None.
  notice_and_action: None; public visitor entries are stated to be permanent.
  transparency_report: 'None in the DSA sense. /stats, /pulse, /observatory and /corrections publish live operational counts and a dated record of the store''s own errors — accountability surfaces, not a takedown/request transparency report.'
