- id: rfc8594-sunset
  name: RFC 8594 Sunset header + Deprecation header
  conforms: true
  verification: policy-only
  evidence: >-
    x-versioning.deprecation in the OpenAPI and https://scvd.store/deprecation: "A version being retired
    serves the RFC 8594 Deprecation and Sunset headers on every response for at least 90 days before it stops
    answering, and the date is published at /developers before the headers appear"; headers named Sunset,
    Deprecation, Link rel="sunset", Link rel="successor-version". currently_deprecated is [] and a HEAD on the
    deprecated /zodiac route on 2026-09-19 returned no Deprecation/Sunset header — consistent with the policy
    ("Nothing is deprecated today, so nothing sends them today"), so the headers themselves were not observed.
- id: ietf-ratelimit-headers
  name: IETF RateLimit header fields (draft-ietf-httpapi-ratelimit-headers)
  conforms: true
  verification: declared
  evidence: >-
    components.headers RateLimit-Limit, RateLimit-Remaining, RateLimit-Reset, RateLimit-Policy and RateLimit
