summary: >-
  SCVD General Store's conformance profile is the agentic-commerce protocol stack, implemented unusually
  completely and declared in the contract itself rather than only in prose: x402 v2 with the Signed Offers &
  Receipts extension (JWS EdDSA over Ed25519, kid as a did:web URL) on every one of 39 402-bearing operations;
  RFC 9728 protected-resource metadata that honestly declares no authorization server; RFC 9457 problem
  objects declared on every 4xx/5xx; an RFC 9727 API catalog; RFC 9116 security.txt; RFC 8594 Sunset and
  Deprecation headers as written policy (nothing is deprecated today, so none are sent today); the IETF
  RateLimit header fields on the five metered doors; MCP 2025-06-18 with MCP Apps ui:// templates; an A2A 0.3.0
  card graded conformant; a UCP 2026-08-25 business profile; ARD 1.0; did:web; Web Bot Auth key directory
  (RFC 9421); ERC-8004; Atom feeds; llms.txt, agents.md and SKILL.md conventions. It declares no OAuth, no
  OIDC, no SOC 2/ISO/PCI — trust.json lists "no third-party security audit of anything here, and no plans for
  one" under not_claimed — so no Compliance pointer is emitted. The x402 declaration is the market's
  domain-standard signature and is recorded as such.
standards:
- id: x402
  name: x402 HTTP payment protocol
  version: '2'
  conforms: true
  domain_standard_signature: true
  verification: observed
  evidence: >-
    CONTRACT: openapi/scvd-store-openapi.json declares 402 responses on 39 operations (35 GET /api/buy/{item}
    doors, /api/practice/{scenario}, the almanac and open-for-business pages) each with x-payment-info
    {protocol: x402, x402Version: 2, scheme: exact, accepts[] per rail} and components.headers
    PAYMENT-REQUIRED / WWW-Authenticate; components.parameters.IdempotencyKey. LIVE: GET
    https://scvd.store/api/buy/small_blessing on 2026-09-19 returned HTTP 402 with a base64 PAYMENT-REQUIRED
    header decoding to {"x402Version":2,"accepts":[5 entries: eip155:8453, eip155:137, eip155:42161,
    eip155:480, solana:5eykt…; scheme exact, amount "5000", asset USDC contract, payTo, maxTimeoutSeconds 300,
    extra.assetTransferMethod eip3009],"extensions":{"bazaar":…,"offer-receipt":{offers:[5 JWS]}}} and a
    PaymentRequiredChallenge body with idempotency.suggested_key. DISCOVERY: /.well-known/x402.json (43
    resources), /.well-known/oauth-protected-resource x402 block.
  note: The 402 is the provider's product as well as its paywall — it runs a free conformance battery (31 named defect classes, errors/scvd-store-defects.json) against OTHER x402 endpoints.
- id: x402-offer-receipt
  name: x402 Signed Offers & Receipts extension
  conforms: true
  domain_standard_signature: true
  evidence: >-
    The live 402 carried extensions.offer-receipt.info.offers[] — one compact JWS per accepts entry, alg EdDSA,
    kid did:web:scvd.store#key-2, committing resourceUrl, scheme, network, asset, payTo, amount and validUntil
    before payment. trust.json standards.what_is_implemented names the extension and PAYMENT-RESPONSE
    receipts; /.well-known/conformance/offer-receipt-vectors.json (200, 14,608 bytes) publishes deterministic
    vectors; POST /api/conformance/v1 verifies any issuer's artifact.
- id: mpp
  name: 'Machine Payments Protocol (payment challenge via WWW-Authenticate: Payment)'
  conforms: true
  verification: observed
  evidence: >-
    The live 402 also carried `WWW-Authenticate: Payment id=…, realm="scvd.store", method="evm",
    intent="charge", request=<base64>, expires=…, opaque=…`; the OpenAPI's x-scvd-native-checkout block and
    per-operation x-payment-info.protocols list {mpp: {method: evm, intent: charge}} beside x402; the homepage
    counts purchases "via x402" and "via mpp" separately. trust.json discovery_by_protocol lists MPP as
    "inspection" scope with a MPPScan listing confirmed 2026-09-19.
- id: rfc9728-protected-resource
  name: OAuth 2.0 Protected Resource Metadata
  conforms: true
  verification: observed
  evidence: >-
    GET /.well-known/oauth-protected-resource -> 200 application/json with resource, resource_name,
    resource_documentation, resource_policy_uri, resource_tos_uri, bearer_methods_supported [],
    scopes_supported []. authorization_servers is ABSENT on purpose (no OAuth server exists; auth.md explains
    the omission). Every 402 carries WWW-Authenticate naming resource_metadata per the spec's own header
    description.
  note: Present and well-formed, but it advertises no authorization server, no dynamic client registration and no delegated identity — the document's job here is to say "anonymous or x402" in machine form.
