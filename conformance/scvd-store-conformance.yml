- id: rfc9457-problem-details
  name: RFC 9457 Problem Details
  conforms: true
  verification: partial
  evidence: >-
    CONTRACT: components.schemas.Problem (type, title, status, detail, instance + the legacy `error` field,
    required [error]); 23 responses declare application/problem+json and every 4xx/5xx references the Problem
    schema through components.responses BadRequest/NotFound/TooManyRequests/ServerError; auth.md: "Every 4xx
    and 5xx from this store is an RFC 9457 problem object with a human-readable error field beside it".
    LIVE: the two error bodies observed on 2026-09-19 (400 on POST /api/preflight/v2 with an empty body; 404 on
    GET /api/verify/{nonexistent}) were served as application/json with `error`, `code`/`next_action`/
    `documentation_url` or `valid`/`freshly_minted_note` fields and WITHOUT type/title/status/instance — the
    Problem schema's required set is only [error], so they validate against it, but they are not
    problem+json on the wire.
  note: Declared everywhere; the observed responses carry the store's own envelope with the RFC fields optional. Recorded as partial rather than claiming full wire conformance.
