description: >-
  SCVD publishes no single API changelog page (/changelog 404). Change is recorded three ways: the version
  table on /deprecation (url-path versions with since dates), the dated corrections log at /corrections
  (75 Atom entries, each a thing the store got wrong, when, who found it and what changed — the closest
  thing to a release log for behaviour), and per-package CHANGELOG.md files in the open-source monorepo (cli,
  verifier, defects, corpus-client, mcp-starter, x402-preflight*). Dated product changes are also stated
  inline in agents.md, pricing.md and mcp.md. The recent window is captured below from those sources; the
  live feeds are the source of truth.
versioning:
  scheme: url-path for instruments; semver for packages and the MCP server (0.5.0); OpenAPI info.version 0.3.0; skill.md 3.18.0
  detail: lifecycle/scvd-store-lifecycle.yml
