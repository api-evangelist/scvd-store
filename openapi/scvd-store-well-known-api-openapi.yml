  /.well-known/agent-instructions:
    get:
      summary: When to reach for this store
      description: 'The situations this store is the right call for, each with the items that answer it and the exact request to make — plus the half nobody publishes: when you do not need us. Derived from the same list /llms.txt renders, so the two cannot disagree.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - name
                - what_this_is
                - when_to_use
                - how_to_call
                properties:
                  name:
                    type: string
                  what_this_is:
                    type: string
                  when_to_use:
                    type: array
                    description: One entry per situation, with the items that answer it and a worked request.
                    items:
                      type: object
                      properties:
                        situation:
                          type: string
                        items:
                          type: array
                          items:
                            type: string
                        example_request:
                          type: string
                  when_not_to_use:
                    type: string
                    description: Named rather than left to be discovered, because the cheapest call is the one nobody had to make.
                  how_to_call:
