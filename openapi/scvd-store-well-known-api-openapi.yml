      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - linkset
                properties:
                  linkset:
                    type: array
                    items:
                      type: object
                    description: One anchor per developer resource, each with its link relations, per RFC 9727.
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
