      summary: Agentic Resource Discovery manifest
      description: 'Every agentic resource this origin publishes, as ARD entries: the MCP server, the A2A agent card, the HTTP API and the store''s two skills, each with its IANA media type, its URL, the representative queries a registry indexes it by, and a trust manifest naming this store''s did:web. A DIFFERENT document from /.well-known/api-catalog, which is RFC 9727 and answers where the API is documented; this one answers what agentic resources exist here. Free.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - specVersion
                - host
                - entries
                additionalProperties: false
                properties:
                  specVersion:
                    type: string
                    description: The catalog envelope version; distinct from the ARD proposal revision.
                  host:
                    type: object
                    required:
                    - displayName
                    - identifier
                    properties:
                      displayName:
                        type: string
                      identifier:
                        type: string
                        description: The publisher's did:web identity.
                      trustManifest:
                        type: object
                        description: Publisher identity and trust evidence; verification procedure at its governanceUri.
                  entries:
                    type: array
                    items:
                      type: object
                    description: The store's published resources, with per-entry timestamps and identity.
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
