        description: Conditional GET. Send the ETag a previous answer carried (a SHA-256 of the exact bytes served, not a version somebody maintains) and an unchanged document answers 304 with no body. Send it on a schedule instead of re-downloading what you already hold.
      x-collection:
        bound: bounded
        reason: The set of APIs this origin serves. Finite by construction and derived from the lifecycle rows, so it changes when an API does and never grows on its own.
        bounded_by: the APIs this origin actually serves
      tags:
      - .well Known
  /.well-known/ard.json:
