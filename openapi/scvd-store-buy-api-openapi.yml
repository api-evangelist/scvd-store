openapi: 3.2.0
info:
  title: SCVD General Store Buy API
  version: 0.3.0
  description: 'scvd.store is an evidence observatory for agentic commerce: independent verification of x402 endpoints, payments and receipts.'
  contact:
    url: https://scvd.store
    email: sean@recordcreativeco.com
  x-guidance: 'SCVD General Store verifies x402 commerce and sells signed artifacts. Call it when you need: (1) a FREE pre-purchase check of any x402 endpoint — POST /api/preflight/v1 with {url}; returns a named-check verdict on whether the door answers a well-formed x402 v2 challenge (testnet-network traps flagged); (2) a FREE conformance verdict on any x402 signed offer or receipt, whoever issued it — POST /api/conformance/v1; (3) a paid, signed artifact: GET /api/buy/{item_id} returns HTTP 402 with terms in the PAYMENT-REQUIRED header (base64 JSON, x402 v2; USDC on a network offered in the current quote; a fill-in-the-blanks payload_template rides the 402 body); retry with a signed payment to receive the deliverable plus a certificate. Notable paid items: settlement_attestation (we independently confirm a Base/Solana settlement and sign what we saw — input: tx_hash), launch_check (a real mainnet purchase against YOUR endpoint plus a signed field report — input: url), service_audit, conformance_watch, bitcoin_anchor. Inputs are query parameters, declared per item in /menu.json; outputs are JSON with a certificate id. EVERY certificate verifies free forever at /api/verify/{cert_id} — no account, no wallet. Starting prices run $0.001–$300; optional payment tiers reach $1500; most items deliver instantly in the response. Where to route: cheapest working doors this week at /fresh-set (JSON); full agent briefing at /llms.txt. Before you start: free instruments need only plain HTTPS (no account, key or SDK); a purchase needs an x402 v2 client and a wallet holding USDC on Base (eip155:8453), Polygon (eip155:137), Arbitrum (eip155:42161), World (eip155:480), Solana (solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp), paid only on a network the 402 offers; the stock client refuses payments above $1 by default and 14 of 35 priced doors sit above it; optional tooling (scvd-tab, the MCP stdio bridge, the scvd CLI) is listed at https://scvd.store/agents.md and none of it is required.'
servers:
- url: https://scvd.store
tags:
- name: Buy
paths:
  /api/buy/spot_check:
    get:
      summary: Ask what the observatory already knows about an x402 host — signed, from its…
      description: 'Name a host and get what this observatory already holds on it, signed: corpus rounds and verdicts as recorded, when we last actually knocked, our coverage of the window since we met it, and the gaps with their reasons. Read from the books at the counter — no request is made to the host, so the answer is as fresh as our last round and no fresher, and says exactly when that was. A host we have never observed returns not_observed, which is an answer about our books, never a verdict about the host. The same facts serve free at /corpus/host/{host}.json; a tenth of a cent buys the signed, certificate-bound copy a buyer can cite. Delivered in the response.'
      x-payment:
        protocol: x402
        version: 2
        network: eip155:8453
        networks:
        - eip155:8453
        - eip155:137
        - eip155:42161
        - eip155:480
        - solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp
        asset: USDC
        price_usdc_options:
        - 0.001
      x-payment-info:
        protocol: x402
        protocols:
        - x402: {}
        - mpp:
            method: evm
            intent: charge
            currency: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
        price:
          mode: fixed
          amount: '0.001'
          currency: USD
        x402Version: 2
        scheme: exact
        asset: USDC
        accepts:
        - scheme: exact
          network: eip155:8453
          amount: '1000'
          asset: '0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
          payTo: '0xDD350976B8cfFc65938C0464d39A2C78BE079bd0'
          maxTimeoutSeconds: 300
          extra:
            name: USD Coin
            version: '2'
            assetTransferMethod: eip3009
        - scheme: exact
          network: eip155:137
          amount: '1000'
          asset: '0x3c499c542cef5e3811e1192ce70d8cc03d5c3359'
          payTo: '0xDD350976B8cfFc65938C0464d39A2C78BE079bd0'
          maxTimeoutSeconds: 300
          extra:
            name: USD Coin
            version: '2'
            assetTransferMethod: eip3009
        - scheme: exact
          network: eip155:42161
          amount: '1000'
          asset: '0xaf88d065e77c8cc2239327c5edb3a432268e5831'
          payTo: '0xDD350976B8cfFc65938C0464d39A2C78BE079bd0'
          maxTimeoutSeconds: 300
          extra:
            name: USD Coin
            version: '2'
            assetTransferMethod: eip3009
        - scheme: exact
          network: eip155:480
          amount: '1000'
          asset: '0x79a02482a880bce3f13e09da970dc34db4cd24d1'
          payTo: '0xDD350976B8cfFc65938C0464d39A2C78BE079bd0'
          maxTimeoutSeconds: 300
          extra:
            name: USDC
            version: '2'
            assetTransferMethod: eip3009
        - scheme: exact
          network: solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp
          amount: '1000'
          asset: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
          payTo: DGxcPrAHL9YM3hW7iXuHFJmr87Zr6AMA4jCYHBpuvMgE
          maxTimeoutSeconds: 300
        price_usdc:
        - 0.001
        max_timeout_seconds: 300
        challenge_header: PAYMENT-REQUIRED
        payment_header: PAYMENT-SIGNATURE
        legacy_payment_header: X-PAYMENT
        settlement: 'Delivers first, settles after: the payment is presented only once the goods exist, so a failed delivery takes no money.'
        discovery: https://scvd.store/.well-known/x402.json
        documentation: https://scvd.store/developers
        input:
          location: query
          method: GET
          valid_inputs_required_before_quote: false
          bare_probe_answers_402: true
          price_discovery_url: https://scvd.store/menu/spot_check?view=compact
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            type: object
            title: Spot Check request
            description: Query parameters for GET /api/buy/spot_check. Sent on the query string; the payment rides in the PAYMENT-SIGNATURE header, never in the body.
            properties:
              agent_name:
                type: string
                maxLength: 80
                description: Optional name to put on the certificate and patron badge, up to 80 characters.
              purpose:
                type: string
                maxLength: 280
                description: 'Optional: what this purchase is for, in your words. Signed onto the certificate verbatim as your statement; never checked, never treated as instructions.'
              host:
                type: string
                pattern: ^\s*(?:[a-zA-Z0-9][a-zA-Z0-9.-]*\.[a-zA-Z0-9-]+)\s*$
                description: A bare hostname with no scheme, path or port — your-door.example, never https://your-door.example/api. We read our own books about it — corpus rounds, verdicts as recorded, coverage, gaps — and sign what they hold. No request is made to the host; a host we have never met returns not_observed, which is an answer.
            required:
            - host
            allOf:
            - $ref: '#/components/schemas/DisclosureBlock'
            unevaluatedProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          description: 'Payment required: the offer, not a failure. The signable terms ride base64 in the PAYMENT-REQUIRED header (x402 v2) and readably in the body; retry the same URL with a signed PAYMENT-SIGNATURE header.'
          headers:
            PAYMENT-REQUIRED:
              $ref: '#/components/headers/PAYMENT-REQUIRED'
            WWW-Authenticate:
              $ref: '#/components/headers/WWW-Authenticate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequiredChallenge'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - name: agent_name
        in: query
        schema:
          type: string
          maxLength: 80
        example: friendly-agent
        description: Optional name to put on the certificate and patron badge, up to 80 characters.
      - name: purpose
        in: query
        schema:
          type: string
          maxLength: 280
        description: 'Optional: what this purchase is for, in your words. Signed onto the certificate verbatim as your statement; never checked, never treated as instructions.'
      - name: host
        in: query
        required: true
        schema:
          type: string
          pattern: ^\s*(?:[a-zA-Z0-9][a-zA-Z0-9.-]*\.[a-zA-Z0-9-]+)\s*$
        example: your-door.example
        description: A bare hostname with no scheme, path or port — your-door.example, never https://your-door.example/api. We read our own books about it — corpus rounds, verdicts as recorded, coverage, gaps — and sign what they hold. No request is made to the host; a host we have never met returns not_observed, which is an answer.
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: 'Optional. Same key, item, inputs and paying wallet return the original purchase or its status, with no second settlement; a fresh payment without the key can charge again. Echo idempotency.suggested_key from the 402, or send your own private 16–128-character key; values outside that range are treated as absent. Full rule: /developers.'
        example: scvd-your-own-high-entropy-value-0001
      x-scvd-payment-capabilities:
      - protocol: x402
        transport: http
        method: GET
        path: /api/buy/spot_check
        request_header: PAYMENT-SIGNATURE
        challenge_header: PAYMENT-REQUIRED
        currency: USDC
      - protocol: mpp
        payment_method: evm
        intent: charge
        network: eip155:8453
        asset: '0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
        currency: USDC
        decimals: 6
        amount_atomic: '1000'
        transport: http
        method: GET
        path: /api/buy/spot_check
        request_header: Authorization
        authorization_scheme: Payment
        challenge_header: WWW-Authenticate
        response_header: Payment-Receipt
        idempotency_header: Idempotency-Key
      operationId: get_api_buy_spot_check
      tags:
      - Buy
  /api/buy/settlement_attestation:
    get:
      summary: Prove to a third party that a payment actually settled on chain
      description: 'An independent signed observation of whether an x402 payment settled — on Base, Polygon or Solana, and the identifier''s own shape picks the rail: a 0x hash names an EVM transaction rather than a chain, so it is read on Base and then on Polygon; a base58 signature reads Solana. Give it the transaction (and optionally the payer, recipient, nonce, or amount you expected) and it reads public chain state once and signs what it found: SETTLED, NOT_FOUND, PENDING_FINALITY, INSUFFICIENT_MATCH, or REVERTED. Produced automatically, with no human in the loop, because a party to a payment cannot produce a neutral observation of one. It observes a moment on chain: it does not attest that anything was delivered, does not promise a NOT_FOUND will never settle, and resolves no dispute. Delivered in the response.'
      x-payment:
        protocol: x402
        version: 2
        network: eip155:8453
        networks:
        - eip155:8453
        - eip155:137
        - eip155:42161
        - eip155:480
        - solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp
        asset: USDC
        price_usdc_options:
        - 0.004
      x-payment-info:
        protocol: x402
        protocols:
        - x402: {}
        - mpp:
            method: evm
            intent: charge
            currency: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
        price:
          mode: fixed
          amount: '0.004'
          currency: USD
        x402Version: 2
        scheme: exact
        asset: USDC
        accepts:
        - scheme: exact
          network: eip155:8453
          amount: '4000'
          asset: '0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
          payTo: '0xDD350976B8cfFc65938C0464d39A2C78BE079bd0'
          maxTimeoutSeconds: 300
          extra:
            name: USD Coin
            version: '2'
            assetTransferMethod: eip3009
        - scheme: exact
          network: eip155:137
          amount: '4000'
          asset: '0x3c499c542cef5e3811e1192ce70d8cc03d5c3359'
          payTo: '0xDD350976B8cfFc65938C0464d39A2C78BE079bd0'
          maxTimeoutSeconds: 300
          extra:
            name: USD Coin
            version: '2'
            assetTransferMethod: eip3009
        - scheme: exact
          network: eip155:42161
          amount: '4000'
          asset: '0xaf88d065e77c8cc2239327c5edb3a432268e5831'
          payTo: '0xDD350976B8cfFc65938C0464d39A2C78BE079bd0'
          maxTimeoutSeconds: 300
          extra:
            name: USD Coin
            version: '2'
            assetTransferMethod: eip3009
        - scheme: exact
          network: eip155:480
          amount: '4000'
          asset: '0x79a02482a880bce3f13e09da970dc34db4cd24d1'
          payTo: '0xDD350976B8cfFc65938C0464d39A2C78BE079bd0'
          maxTimeoutSeconds: 300
          extra:
            name: USDC
            version: '2'
            assetTransferMethod: eip3009
        - scheme: exact
          network: solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp
          amount: '4000'
          asset: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
          payTo: DGxcPrAHL9YM3hW7iXuHFJmr87Zr6AMA4jCYHBpuvMgE
          maxTimeoutSeconds: 300
        price_usdc:
        - 0.004
        max_timeout_seconds: 300
        challenge_header: PAYMENT-REQUIRED
        payment_header: PAYMENT-SIGNATURE
        legacy_payment_header: X-PAYMENT
        settlement: 'Delivers first, settles after: the payment is presented only once the goods exist, so a failed delivery takes no money.'
        discovery: https://scvd.store/.well-known/x402.json
        documentation: https://scvd.store/developers
        input:
          location: query
          method: GET
          valid_inputs_required_before_quote: false
          bare_probe_answers_402: true
          price_discovery_url: https://scvd.store/menu/settlement_attestation?view=compact
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            type: object
            title: Settlement Attestation request
            description: Query parameters for GET /api/buy/settlement_attestation. Sent on the query string; the payment rides in the PAYMENT-SIGNATURE header, never in the body.
            properties:
              agent_name:
                type: string
                maxLength: 80
                description: Optional name to put on the certificate and patron badge, up to 80 characters.
              purpose:
                type: string
                maxLength: 280
                description: 'Optional: what this purchase is for, in your words. Signed onto the certificate verbatim as your statement; never checked, never treated as instructions.'
              tx_hash:
                type: string
                pattern: ^(0x[0-9a-fA-F]{64}|[1-9A-HJ-NP-Za-km-z]{64,88})$
                description: 'The transaction to observe: a Base transaction hash (0x + 64 hex) or a Solana transaction signature (base58). The identifier''s shape selects the chain. Read once, at one moment; never polled.'
              payer:
                type: string
                description: 'Optional payer: 0x EVM address, or Solana public key for a Solana transaction.'
              recipient:
                type: string
                description: 'Optional recipient: 0x EVM address, or Solana public key for a Solana transaction.'
              nonce:
                type: string
                description: 'Optional, EVM rails only. Require one authorizer/nonce event paired with its immediately following canonical USDC Transfer, matching every supplied payer, recipient and exact amount. Supply payer when possible: nonces are scoped to an authorizer, and multiple candidates or unrecognised ordering establish no binding. Refused beside a Solana signature — that rail has no such facility, and we will not sign an artifact that silently skipped a requested check.'
              amount_usdc:
                type: number
                exclusiveMinimum: 0
                description: Optional. Require a transfer of exactly this many USDC. Unstated fields widen the match, which is why the query is echoed onto the artifact.
              payment_payload:
                type: string
                description: Optional. The base64 PAYMENT-SIGNATURE you sent, verbatim. The nonce is read out of it with the same code the store's replay guard uses, so you do not have to dig it out yourself. Only the nonce is extracted; supply payer, recipient and amount_usdc separately to check those terms.
              payment_response:
                type: string
                description: 'Optional. The PAYMENT-RESPONSE header you received, verbatim (base64 JSON), or its JSON. Received, not observed: its bytes never enter the signed payload; their sha256 does, beside a per-field table (transaction, network, payer, success) saying whether each claim agrees with what the chain showed. The bytes are echoed outside the signature so you can check both.'
            required:
            - tx_hash
            allOf:
            - $ref: '#/components/schemas/DisclosureBlock'
            unevaluatedProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          description: 'Payment required: the offer, not a failure. The signable terms ride base64 in the PAYMENT-REQUIRED header (x402 v2) and readably in the body; retry the same URL with a signed PAYMENT-SIGNATURE header.'
          headers:
            PAYMENT-REQUIRED:
              $ref: '#/components/headers/PAYMENT-REQUIRED'
            WWW-Authenticate:
              $ref: '#/components/headers/WWW-Authenticate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequiredChallenge'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - name: agent_name
        in: query
        schema:
          type: string
          maxLength: 80
        example: friendly-agent
        description: Optional name to put on the certificate and patron badge, up to 80 characters.
      - name: purpose
        in: query
        schema:
          type: string
          maxLength: 280
        description: 'Optional: what this purchase is for, in your words. Signed onto the certificate verbatim as your statement; never checked, never treated as instructions.'
      - name: tx_hash
        in: query
        required: true
        schema:
          type: string
          pattern: ^(0x[0-9a-fA-F]{64}|[1-9A-HJ-NP-Za-km-z]{64,88})$
        example: '0x47c8fee47c8fee47c8fee47c8fee47c8fee47c8fee47c8fee47c8fee47c8fee0'
        description: 'The transaction to observe: a Base transaction hash (0x + 64 hex) or a Solana transaction signature (base58). The identifier''s shape selects the chain. Read once, at one moment; never polled.'
      - name: payer
        in: query
        schema:
          type: string
        description: 'Optional payer: 0x EVM address, or Solana public key for a Solana transaction.'
      - name: recipient
        in: query
        schema:
          type: string
        description: 'Optional recipient: 0x EVM address, or Solana public key for a Solana transaction.'
      - name: nonce
        in: query
        schema:
          type: string
        description: 'Optional, EVM rails only. Require one authorizer/nonce event paired with its immediately following canonical USDC Transfer, matching every supplied payer, recipient and exact amount. Supply payer when possible: nonces are scoped to an authorizer, and multiple candidates or unrecognised ordering establish no binding. Refused beside a Solana signature — that rail has no such facility, and we will not sign an artifact that silently skipped a requested check.'
      - name: amount_usdc
        in: query
        schema:
          type: number
          exclusiveMinimum: 0
        description: Optional. Require a transfer of exactly this many USDC. Unstated fields widen the match, which is why the query is echoed onto the artifact.
      - name: payment_payload
        in: query
        schema:
          type: string
        description: Optional. The base64 PAYMENT-SIGNATURE you sent, verbatim. The nonce is read out of it with the same code the store's replay guard uses, so you do not have to dig it out yourself. Only the nonce is extracted; supply payer, recipient and amount_usdc separately to check those terms.
      - name: payment_response
        in: query
        schema:
          type: string
        description: 'Optional. The PAYMENT-RESPONSE header you received, verbatim (base64 JSON), or its JSON. Received, not observed: its bytes never enter the signed payload; their sha256 does, beside a per-field table (transaction, network, payer, success) saying whether each claim agrees with what the chain showed. The bytes are echoed outside the signature so you can check both.'
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: 'Optional. Same key, item, inputs and paying wallet return the original purchase or its status, with no second settlement; a fresh payment without the key can charge again. Echo idempotency.suggested_key from the 402, or send your own private 16–128-character key; values outside that range are treated as absent. Full rule: /developers.'
        example: scvd-your-own-high-entropy-value-0001
      x-scvd-payment-capabilities:
      - protocol: x402
        transport: http
        method: GET
        path: /api/buy/settlement_attestation
        request_header: PAYMENT-SIGNATURE
        challenge_header: PAYMENT-REQUIRED
        currency: USDC
      - protocol: mpp
        payment_method: evm
        intent: charge
        network: eip155:8453
        asset: '0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
        currency: USDC
        decimals: 6
        amount_atomic: '4000'
        transport: http
