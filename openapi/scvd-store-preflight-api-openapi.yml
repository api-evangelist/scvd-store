components:
  responses:
    ServerError:
      description: Something fell off a shelf. Nothing was charged.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: 'Too many requests, from the edge rather than from the store''s own logic. Retry after the interval named in Retry-After; the store does not charge for a refusal. The free preflight is limited — 30 probes per isolate per minute, 60 global — because it spends outbound requests to a host the caller chooses. Every answer the limiter METERED carries the IETF RateLimit fields — the 200 and the 429 — so you can pace against the live number instead of discovering the ceiling by being refused: RateLimit-Limit / -Remaining / -Reset report whichever of the two buckets is closer to binding, and RateLimit / RateLimit-Policy name both. Past either ceiling it returns 429 with Retry-After. A validation refusal (400, e.g. a missing or unprobeable URL) returns BEFORE either bucket is touched and carries no RateLimit fields, because a malformed request never spent a probe; this contract used to declare them on those responses too, which described a header that had never been sent. No other operation enforces an application-level ceiling, and so returns no RateLimit headers: declaring a ceiling nothing enforces would be worse than declaring none. A 429 can also arrive from the edge under abuse conditions. A refused request is never charged for. The two figures above are read from the limiter''s own constants, not restated here — this string asserted that NO limit existed for a day after one shipped.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
    NotModified:
      description: 'Not Modified: the ETag you sent still names these exact bytes. No body; every other header is as the 200 would carry it.'
    TooManyRequestsMetered:
      description: 'Too many requests, from the edge rather than from the store''s own logic. Retry after the interval named in Retry-After; the store does not charge for a refusal. The free preflight is limited — 30 probes per isolate per minute, 60 global — because it spends outbound requests to a host the caller chooses. Every answer the limiter METERED carries the IETF RateLimit fields — the 200 and the 429 — so you can pace against the live number instead of discovering the ceiling by being refused: RateLimit-Limit / -Remaining / -Reset report whichever of the two buckets is closer to binding, and RateLimit / RateLimit-Policy name both. Past either ceiling it returns 429 with Retry-After. A validation refusal (400, e.g. a missing or unprobeable URL) returns BEFORE either bucket is touched and carries no RateLimit fields, because a malformed request never spent a probe; this contract used to declare them on those responses too, which described a header that had never been sent. No other operation enforces an application-level ceiling, and so returns no RateLimit headers: declaring a ceiling nothing enforces would be worse than declaring none. A 429 can also arrive from the edge under abuse conditions. A refused request is never charged for. The two figures above are read from the limiter''s own constants, not restated here — this string asserted that NO limit existed for a day after one shipped.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
    BadRequest:
      description: The request was malformed or a required parameter was missing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource. The body names where to look instead.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    PreflightVerdict:
      type: object
      required:
      - version
      - verdict
      - reached_level
      - checks_vector
      - checks
      - advisories
      - remediation
      - protocols_spoken
      - mpp
      - probe_method
      - single_probe_note
      - what_this_cannot_tell_you
      - our_conflict_of_interest
      properties:
        version:
          type: string
          description: The battery that scored this probe.
        verdict:
          type: string
          enum:
          - ready
          - not_ready
          - unreachable
          - method_unresolved
          description: ready = every structural check passed. not_ready = reachable but failed at least one. unreachable = the probe itself could not complete, which says nothing about their code — the detail says whose side the failure was on. method_unresolved = the door refused every HTTP method this probe sends (405/501), so NO check ran and nothing was observed about the challenge; it is a statement about our reach, never a finding against the endpoint, and it is deliberately not scorable as ready or not_ready.
        reached_level:
          type: string
          enum:
          - none
          - L1
          - L2
          - L3a
          description: The rung this probe reached before it stopped.
        reached_level_meaning:
          type: string
        network_failure:
          type: string
          enum:
          - unlocalized
          description: Present only when reached_level is "none".
        checks_vector:
          type: array
          description: 'The per-check view: a check that never ran is not a check that passed. not_reached means an earlier check failed and blocked_by names it; not_exercised means the door refused every method the probe sends as a method (405/501), so nothing was asked — a wrong verb, never a defect — and refused_methods names them.'
          items:
            type: object
            required:
            - name
            - state
            - detail
            properties:
              name:
                type: string
              state:
                type: string
                enum:
                - pass
                - fail
                - not_reached
                - not_exercised
              blocked_by:
                type: string
                description: Set only on not_reached.
              refused_methods:
                type: array
                items:
                  type: string
                description: 'Set only on not_exercised: every method the door refused, in the order sent.'
              detail:
                type: string
        checks:
          type: array
          description: The legacy two-state list, unchanged, for consumers that read the old shape.
          items:
            type: object
            required:
            - name
            - ok
            - detail
            properties:
              name:
                type: string
              ok:
                type: boolean
              detail:
                type: string
        advisories:
          type: array
          description: True and worth knowing, never folded into the verdict.
          items:
            type: object
            required:
            - name
            - detail
            properties:
              name:
                type: string
              detail:
                type: string
        also_under:
          type: object
          description: The SAME probe scored under the other battery, so a reader comparing verdicts never has to guess whether the doors differed or the rules did.
          properties:
            version:
              type: string
            verdict:
              type: string
              enum:
              - ready
              - not_ready
              - unreachable
            difference:
              type: string
        protocols_spoken:
          type: array
          items:
            type: string
            enum:
            - x402
            - mpp
          description: 'Which protocols the 402 speaks, derived from its headers: x402 when PAYMENT-REQUIRED is present, mpp when a WWW-Authenticate: Payment challenge parses. The verdict keeps meaning x402-ready, permanently; read this for the union.'
        mpp_core:
          type: object
          description: The additive mpp-core-v1 observable core reading under draft-01. Separates failed checks from unmeasured requirements; never changes the x402 verdict or historical MPP battery.
          properties:
            battery:
              type: string
              enum:
              - mpp-core-v1
            spec:
              type: object
            state:
              type: string
            observed_at:
              type: string
              format: date-time
            checks:
              type: array
              items:
                type: object
            challenges:
              type: array
              items:
                type: object
            counts:
              type: object
            problem:
              type: object
            gaps:
              type: array
              items:
                type: string
        mpp:
          type: object
          required:
          - battery
          - spec
          - spoken
          - challenges
          - checks
          - advisories
          - what_this_cannot_tell_you
          description: 'The MPP battery''s reading of the same bytes (mpp-v1, draft-00): whether the door speaks it, its challenges summarised, its named checks when it does (none when it does not — a check against no challenge is not an observation), its advisories outside any verdict, and what one unpaid GET cannot tell you.'
          properties:
            battery:
              type: string
            spec:
              type: string
            spoken:
              type: boolean
            challenges:
              type: array
              items:
                type: object
            checks:
              type: array
              items:
                type: object
                required:
                - name
                - ok
                - detail
                properties:
                  name:
                    type: string
                  ok:
                    type: boolean
                  detail:
                    type: string
            advisories:
              type: array
              items:
                type: object
                required:
                - name
                - detail
                properties:
                  name:
                    type: string
                  detail:
                    type: string
            the_x402_verdict_above:
              type: string
            what_this_cannot_tell_you:
              type: array
              items:
                type: string
        remediation:
          type: array
          description: 'What to do about it, both sides: one row per failed check or raised advisory that a vocabulary class explains — the class, its definition URL, what the operator does, what the buyer does. Derived from /defects.json through the signal already reported; never part of the verdict; empty on a clean door.'
          items:
            type: object
            required:
            - signal
            - kind
            - defect_class
            - definition_url
            - operator
            - buyer
            properties:
              signal:
                type: string
              kind:
                type: string
                enum:
                - check
                - advisory
              defect_class:
                type: string
              title:
                type: string
              detectable:
                type: string
                enum:
                - unpaid
                - paid
              definition_url:
                type: string
                format: uri
              operator:
                type: string
              buyer:
                type: string
              falsified_by:
                type: string
        probe_method:
          type: object
          description: Which question the door actually answered. The probe sends GET first (or the method a catalog declared for the resource) and, if that is refused AS a method with 405 or 501, sends exactly one more — the method named in Allow when the 405 carries one, POST otherwise. At most two requests per call, to the same URL, and only ever about the verb.
          required:
          - used
          - attempted
          - source
          - note
          properties:
            used:
              type: string
              enum:
              - GET
              - POST
              description: The method whose response produced the checks below.
            attempted:
              type: array
              items:
                type: string
                enum:
                - GET
                - POST
              description: Every method sent, in order. More than one means the first was refused as a method.
            source:
              type: string
              enum:
              - declared
              - allow-header
              - fallback
              - default
              description: 'Where the method came from: declared = a catalog or challenge declared it for this resource and nothing was guessed; allow-header = the door''s own 405 named it; fallback = POST, tried once after a method refusal that named nothing; default = GET, what a buyer''s client sends first.'
            note:
              type: string
              description: The same story in plain English, for a human reading the readout.
        single_probe_note:
          type: string
          description: One moment. A passing preflight quoted as an uptime claim is a misquote, and this field is where the response says so. It also says when the reading took two requests rather than one, which happens only on a method refusal.
        what_this_cannot_tell_you:
          type: array
          items:
            type: string
        our_conflict_of_interest:
          type: string
          description: Published in the verdict itself rather than in a policy nobody fetches.
        rate_limit:
          type: object
        store_identity:
          type: object
        the_rest_of_the_ladder:
          type: object
          description: 'The rungs this probe did not climb, and what climbs each one. Replaced next_steps 2026-09-16: the reading named the missing rungs in one place and the paid instruments in another, and a buyer had to join them. Each unclimbed rung carries the item, its price in USDC, the tool that calls it and the URL; a rung nothing can buy today says so rather than being sold a near-miss.'
          properties:
            current_reading:
              type: object
              description: The unsigned preflight's evidence and spending limits.
              properties:
                signed:
                  type: boolean
                proves_payment_or_delivery:
                  type: boolean
                scope:
                  type: string
            free_signed_history:
              type: object
              description: 'Free historical evidence: the lookup is unsigned; verify its cited signed originals, exact subject and observation age separately.'
              properties:
                history_url_template:
                  type: string
                  description: Replace {host} with the endpoint's hostname.
                issuer_key_url:
                  type: string
                guide_url:
                  type: string
                requires_spend_authorization:
                  type: boolean
                scope:
                  type: string
            climbed:
              type: array
              items:
                type: string
            unclimbed:
              type: array
              items:
                type: object
                properties:
                  rung:
                    type: string
                  what_it_is:
                    type: string
                  climbs_it:
                    type:
                    - object
                    - 'null'
                    description: Null when nothing on the shelf climbs this rung.
                    properties:
                      item_id:
                        type: string
                      price_usdc:
                        type: number
                      tool:
                        type: string
                      tool_door:
                        type: string
                        description: The MCP door that tool is on. This reading is served from more than one, and the verifier door at /mcp/verifier lists no buy tool at all.
                      url:
                        type: string
                      what_you_get:
                        type: string
                  why_not:
                    type: string
            already_free:
              type: string
            signed_copy_of_this_reading:
              type:
              - object
              - 'null'
        this_is_not_advice:
          type: string
          description: That the reading is an observation and the spending decision is the reader's, whose risk appetite they know better than this store does.
    Problem:
      type: object
      description: An RFC 9457 problem object. `error` is the store's long-standing human-readable field and is always present; the RFC fields sit beside it.
      properties:
        type:
          type: string
          format: uri
          description: A URI identifying the problem class. Dereferenceable at this origin where one exists.
        title:
          type: string
          description: A short, stable summary of the problem class.
        status:
          type: integer
          description: The HTTP status code, repeated in the body.
        detail:
          type: string
          description: What went wrong with THIS request, in plain language.
        instance:
          type: string
          format: uri
          description: The request path.
        error:
          type: string
          description: The store's human-readable message. Always present, including on responses that predate the typed model.
        retry_same_request:
          type: boolean
          const: false
          description: 'Present on repair responses: correct the selection or inputs before retrying.'
        next_step:
          type: object
          description: Optional free read after a refusal. Catalog and input repairs also include an equivalent MCP read. No payment or buyer arguments are forwarded.
          required:
          - method
          - url
          - payment_required
          properties:
            method:
              type: string
              const: GET
            url:
              type: string
              format: uri
            payment_required:
              type: boolean
              const: false
            mcp:
              type: object
              required:
              - url
              - tool
              - arguments
              properties:
                url:
                  type: string
                  format: uri
                tool:
                  type: string
                  const: find_in_catalog
                arguments:
                  type: object
                  properties:
                    item_id:
                      type: string
                  additionalProperties: false
      required:
      - error
  headers:
    RateLimit-Reset:
      schema:
        type: integer
      description: Seconds until both buckets roll, at the wall-clock minute.
    RateLimit-Policy:
      schema:
        type: string
      description: 'Both policies as structured fields: "isolate";q=N;w=60, "global";q=N;w=60.'
    RateLimit:
      schema:
        type: string
      description: 'Both policies'' live state: "isolate";r=N;t=N, "global";r=N;t=N.'
    RateLimit-Limit:
      schema:
        type: integer
      description: The binding bucket's ceiling per 60-second window.
    RateLimit-Remaining:
      schema:
        type: integer
      description: What is left in the binding bucket. The global backstop is a read-modify-write on eventually consistent storage, so this can read slightly high — never low.
  securitySchemes:
    purchaseStatusToken:
      type: http
      scheme: bearer
      description: Private recovery.status_token returned by a catalogue purchase. This capability reads only its original purchase status.
