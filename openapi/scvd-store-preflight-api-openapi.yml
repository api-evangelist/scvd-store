openapi: 3.2.0
info:
  title: SCVD General Store Preflight API
  version: 0.3.0
  description: 'scvd.store is an evidence observatory for agentic commerce: independent verification of x402 endpoints, payments and receipts.'
  contact:
    url: https://scvd.store
    email: sean@recordcreativeco.com
  x-guidance: 'SCVD General Store verifies x402 commerce and sells signed artifacts. Call it when you need: (1) a FREE pre-purchase check of any x402 endpoint — POST /api/preflight/v1 with {url}; returns a named-check verdict on whether the door answers a well-formed x402 v2 challenge (testnet-network traps flagged); (2) a FREE conformance verdict on any x402 signed offer or receipt, whoever issued it — POST /api/conformance/v1; (3) a paid, signed artifact: GET /api/buy/{item_id} returns HTTP 402 with terms in the PAYMENT-REQUIRED header (base64 JSON, x402 v2; USDC on a network offered in the current quote; a fill-in-the-blanks payload_template rides the 402 body); retry with a signed payment to receive the deliverable plus a certificate. Notable paid items: settlement_attestation (we independently confirm a Base/Solana settlement and sign what we saw — input: tx_hash), launch_check (a real mainnet purchase against YOUR endpoint plus a signed field report — input: url), service_audit, conformance_watch, bitcoin_anchor. Inputs are query parameters, declared per item in /menu.json; outputs are JSON with a certificate id. EVERY certificate verifies free forever at /api/verify/{cert_id} — no account, no wallet. Starting prices run $0.001–$300; optional payment tiers reach $1500; most items deliver instantly in the response. Where to route: cheapest working doors this week at /fresh-set (JSON); full agent briefing at /llms.txt. Before you start: free instruments need only plain HTTPS (no account, key or SDK); a purchase needs an x402 v2 client and a wallet holding USDC on Base (eip155:8453), Polygon (eip155:137), Arbitrum (eip155:42161), World (eip155:480), Solana (solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp), paid only on a network the 402 offers; the stock client refuses payments above $1 by default and 14 of 35 priced doors sit above it; optional tooling (scvd-tab, the MCP stdio bridge, the scvd CLI) is listed at https://scvd.store/agents.md and none of it is required.'
servers:
- url: https://scvd.store
tags:
- name: Preflight
paths:
  /api/preflight/batch:
    post:
      summary: Preflight several x402 doors in one call
      description: 'The same probe as /api/preflight, run over up to 10 URLs, sequentially, each metered as its own probe — batching saves you connections, not outbound requests. Each entry carries the status its own probe returned, so a bad URL beside a good one does not fail the call. A batch over the ceiling is refused whole rather than truncated: a report on doors nobody looked at is the exact defect this instrument exists to catch. Free.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - battery
                - count
                - results
                properties:
                  battery:
                    type: string
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      required:
                      - url
                      - status
                      - result
                      properties:
                        url:
                          type: string
                          nullable: true
                        status:
                          type: integer
                          description: The status this entry's own probe returned.
                        result:
                          allOf:
                          - $ref: '#/components/schemas/PreflightVerdict'
                          description: The same verdict body a single-URL probe returns.
                  not_a_discount:
                    type: string
                    description: Says plainly that each entry was metered as its own probe, so a caller learns it here rather than from a 429 halfway down their list.
                  one_moment_each:
                    type: string
                  single_door:
                    type: string
                    format: uri
                  defect_vocabulary:
                    type: string
                    format: uri
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimit-Policy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
        '400':
          description: The request was malformed or a required parameter was missing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such resource. The body names where to look instead.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequestsMetered'
        '500':
          description: Something fell off a shelf. Nothing was charged.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        description: The x402 doors to walk, at most 10.
        content:
          application/json:
            schema:
              type: object
              required:
              - urls
              additionalProperties: false
              properties:
                urls:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: uri
                    description: An https URL on a public host, same rules as the single-URL door.
      operationId: post_api_preflight_batch
      tags:
      - Preflight
  /api/preflight/checks:
    get:
      summary: The battery manifest
      description: Stable check IDs, what each battery folds into its verdict, the dated changelog, and a ruleset digest recomputable from the document alone. Derived from the same registries the battery runs, so criteria and verdicts cannot disagree. Free.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - core_checks
                - conditional_checks
                - verdict_fold_checks
                - advisories
                - batteries
                - ruleset_digest
                - ruleset_digest_covers
                - how_to_recompute
                properties:
                  core_checks:
                    type: array
                    items:
                      type: string
                    description: Check IDs every battery runs against every door.
                  conditional_checks:
                    type: array
                    items:
                      type: string
                    description: Check IDs that only apply when the door's shape invites them.
                  verdict_fold_checks:
                    type: array
                    items:
                      type: string
                    description: The subset whose failure changes the verdict rather than riding as an advisory.
                  advisories:
                    type: array
                    items:
                      type: string
                    description: Checks reported beside the verdict and never folded into it.
                  batteries:
                    type: object
                    description: Each published battery version and what it folds, so a dated verdict stays readable after the next one ships.
                  changelog:
                    type: array
                    items:
                      type: object
                    description: Dated ruleset changes, newest first.
                  ruleset_digest:
                    type: string
                    description: SHA-256 over the covered fields, recomputable from this document alone.
                  ruleset_digest_covers:
                    type: string
                    description: Exactly which fields the digest is taken over.
                  how_to_recompute:
                    type: string
                    description: The recipe for checking the digest without asking us.
                  note:
                    type: string
                    description: What this manifest does not claim.
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: get_api_preflight_checks
      parameters:
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
        description: Conditional GET. Send the ETag a previous answer carried (a SHA-256 of the exact bytes served, not a version somebody maintains) and an unchanged document answers 304 with no body. Send it on a schedule instead of re-downloading what you already hold.
      tags:
      - Preflight
  /api/preflight/v1:
    get:
      summary: The preflight criteria, v1
      description: Every check this battery runs and what falsifies each one, as JSON — the published criteria a v1 verdict cites. Free.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - title
                - version
                - summary
                - method
                - url
                - what_it_checks
                - what_it_cannot_check
                - the_ladder
                properties:
                  title:
                    type: string
                  version:
                    type: string
                  summary:
                    type: string
                  method:
                    type: string
                    description: The verb that runs it.
                  url:
                    type: string
                    format: uri
                  request:
                    type: object
                    description: The body shape, stated where a caller is already looking.
                  rate_limit:
                    type: string
                    description: What is metered and what is not, in words — the RateLimit headers say it again on every answer.
                  what_it_checks:
                    type: array
                    items:
                      type: string
                    description: Every named check, so a verdict can be read against them.
                  batteries:
                    type: object
                    description: Every published battery and what each folds into its verdict, so a dated verdict stays readable after the next battery ships.
                  common_failures_this_catches:
                    type: object
                  what_it_cannot_check:
                    type: array
                    items:
                      type: string
                    description: The limits, published beside the criteria. One probe is one moment; this list is what that buys and what it does not.
                  the_ladder:
                    type: object
                    description: The assurance rungs, including the ones this instrument never climbs.
                  try_it_against_a_live_endpoint:
                    type: string
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: get_api_preflight_v1
      parameters:
      - name: Accept
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/json
          - text/markdown
        description: 'This door negotiates: application/json, text/markdown, parsed with q-values (RFC 9110 §12.5.1). A bare wildcard or no header gets application/json; a named AI reader that states no preference gets markdown where it is offered. The answer carries Vary.'
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
        description: Conditional GET. Send the ETag a previous answer carried (a SHA-256 of the exact bytes served, not a version somebody maintains) and an unchanged document answers 304 with no body. Send it on a schedule instead of re-downloading what you already hold.
      tags:
      - Preflight
    post:
      summary: Check an x402 endpoint's payment challenge shape (v1)
      description: 'One probe, one moment: 402 status, parseable PAYMENT-REQUIRED header, signable accepts, testnet networks flagged. A shape check, never an uptime claim. Free, and metered — the RFC RateLimit fields ride every answer. Reports the Solana rail read as an advisory rather than folding it into the verdict, so a verdict recorded today means what one recorded in week 34 meant.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreflightVerdict'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimit-Policy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
        '400':
          description: The request was malformed or a required parameter was missing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such resource. The body names where to look instead.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequestsMetered'
        '500':
          description: Something fell off a shelf. Nothing was charged.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        description: The x402 door to walk.
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              additionalProperties: false
              properties:
                url:
                  type: string
                  format: uri
                  description: An https URL on a public host. Private, loopback, link-local and reserved-internal targets are refused, and so is this store's own hostname (a Worker cannot fetch itself).
      operationId: post_api_preflight_v1
      tags:
      - Preflight
  /api/preflight/v2:
    get:
      summary: The preflight criteria, v2
      description: Every check this battery runs and what falsifies each one, as JSON — the published criteria a v2 verdict cites. Free.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - title
                - version
                - summary
                - method
                - url
                - what_it_checks
                - what_it_cannot_check
                - the_ladder
                properties:
                  title:
                    type: string
                  version:
                    type: string
                  summary:
                    type: string
                  method:
                    type: string
                    description: The verb that runs it.
                  url:
                    type: string
                    format: uri
                  request:
                    type: object
                    description: The body shape, stated where a caller is already looking.
                  rate_limit:
                    type: string
                    description: What is metered and what is not, in words — the RateLimit headers say it again on every answer.
                  what_it_checks:
                    type: array
                    items:
                      type: string
                    description: Every named check, so a verdict can be read against them.
                  batteries:
                    type: object
                    description: Every published battery and what each folds into its verdict, so a dated verdict stays readable after the next battery ships.
                  common_failures_this_catches:
                    type: object
                  what_it_cannot_check:
                    type: array
                    items:
                      type: string
                    description: The limits, published beside the criteria. One probe is one moment; this list is what that buys and what it does not.
                  the_ladder:
                    type: object
                    description: The assurance rungs, including the ones this instrument never climbs.
                  try_it_against_a_live_endpoint:
                    type: string
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: get_api_preflight_v2
      parameters:
      - name: Accept
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/json
          - text/markdown
        description: 'This door negotiates: application/json, text/markdown, parsed with q-values (RFC 9110 §12.5.1). A bare wildcard or no header gets application/json; a named AI reader that states no preference gets markdown where it is offered. The answer carries Vary.'
