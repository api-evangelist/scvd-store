    post:
      summary: Check an x402 endpoint's payment challenge shape (v2)
      description: 'One probe, one moment: 402 status, parseable PAYMENT-REQUIRED header, signable accepts, testnet networks flagged. A shape check, never an uptime claim. Free, and metered — the RFC RateLimit fields ride every answer. Folds the Solana rail-receivability read into the verdict; call this one from a new integration.'
      security: []
      responses:
        '200':
          description: OK
          content:
