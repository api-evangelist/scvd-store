summary: >-
  Ten first-party packages, all MIT, all zero-dependency by the provider's stated design, all published from
  one monorepo (github.com/seancrecord/scvd-general-store-repo) under the npm maintainer "scvd-store"
  (sean@recordcreativeco.com — the same contact as the OpenAPI and ai-plugin.json). Eight on npm, one on PyPI,
  one Go module. Every release is dated between 2026-08-28 and 2026-09-19, i.e. within the API's own lifetime
  (preflight v1 since 2026-08-03), so nothing here is stale. None of these hold a key or can pay: the paid
  shelf needs an x402 client such as @x402/fetch, which is Coinbase's, not the provider's. Versions and dates
  are read from the registry metadata endpoints, not restated from docs.
