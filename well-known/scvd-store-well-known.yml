source: >-
  Live GET probes of the named /.well-known/* path list on scvd.store and www.scvd.store, 2026-09-19, plus the
  discovery documents the provider's own RFC 9727 api-catalog, agents.md and llms.txt point at. Every row is a
  request that was issued; every status is the one returned. Only documents that returned a real, correctly
  typed payload were saved (file: populated).
summary:
  hosts_probed: 2
  paths_probed: 44
  documents_served: 20
  hit_count: 20
  path_echo_control: passed
  note: >-
    scvd.store is one of the densest /.well-known/ surfaces in the catalog. It serves an RFC 9116 security.txt,
    an RFC 9728 protected-resource document (with no authorization_servers — deliberately, since there is no
    OAuth server, and the document says so), an RFC 9727 API catalog (application/linkset+json) linking every
    surface, an OpenAI-style ai-plugin.json, an MCP server card, a UCP business profile, an ARD manifest, an
    x402 discovery document, an A2A agent card at three paths, a did:web document, an Ed25519 signing-key
    history, a Web Bot Auth key directory, an ERC-8004 agent registration, a signed liveness beacon, a
    machine-readable trust summary and an agent-instructions document. It does NOT serve OIDC discovery, an
    OAuth authorization-server document, an APIs.json, an AAuth resource document or an ACP manifest — every
    miss is the site's real JSON 404 (711 bytes, application/json, {"error": …}), not an SPA shell, and a
    negative-control path also 404s. /apis.yml is the one anomaly: a Cloudflare 403 HTML challenge page, i.e.
    the edge refusing the .yml extension, not a document. All three MCP endpoints and the A2A endpoint live on
    this same apex host, so the RFC 9728 probe on the MCP host is the apex row. www.scvd.store 301s every path
    to the apex and serves nothing of its own.
