model: pay-per-call in USDC over x402 v2 (Base, Polygon, Arbitrum, World, Solana) or MPP on Base; no plans, no tiers,
  no subscription, no account
summary: 'There are no plans and no tiers here: each door is one price, paid per call, and a door that takes more
  than one amount says so in its row (pricing.md). The charter is ed25519-signed over its RFC 8785 canonical form
  and commits to one_price (every wallet sees the same price; no surge, no A/B), floor_stays_low (the cheapest real
  settlement stays under a penny), tips_are_floors, verification_stays_free (/api/verify, the conformance desk and
  the preflight are free and stay free), changes_are_dated (the menu lives in a public repository), scarcity_is_labor
  (only human-fulfilled items carry caps) and no_gate_on_the_door (no membership required). The 35 rows below are
  the live shelf; every free instrument (preflight, conformance, look, verify, corpus, defects, fresh set, feeds)
  is free and is not a row. Trade-counter resellers pay a published formula instead: trade_price = ceil_to_cent(retail
  x (1 + 20% uplift) / (1 - partner_share)), partner share 5% rising to 8% at 1,000 and 12% at 10,000 monthly deliveries,
  minimum retail $0.50. Regulars'' credit: 5% of every organic purchase banks to the paying wallet, cashes out in
  USDC at $1, idle balances expire after 90 days.'
free_tier:
  price: 0
  included:
  - POST /api/preflight/v1 and /v2 (30 probes per isolate per minute, 60 global)
  - POST /api/conformance/v1
  - POST /api/look/v1
  - POST /api/before-you-pay/v1
  - GET /api/verify/{id} (unlimited, forever)
  - corpus.json, fresh-set, defects.json, doors.json, ledger, feeds
  - MCP tools/list, resources/read, 14 free tools, the 5-tool verifier door
  - 'A2A: all three skills'
  - POST /api/a2a/check (free A2A card check, shared budget)
  note: No account, no key, no signup.
