apis:
- aid: scvd-store:scvd-mcp-servers
  name: SCVD General Store MCP Servers
  description: >-
    Three remote Model Context Protocol servers on the apex host, all Streamable HTTP and all answering
    initialize, tools/list and resources/list anonymously at protocol version 2025-06-18 (serverInfo 0.5.0).
    https://scvd.store/mcp is the store — 14 free instruments (preflight_endpoint, look_at_door, check_before_you_pay,
    check_conformance, verify_artifact, check_a2a_card, find_in_catalog …) and six x402-paid buy_* shelves
    that settle in-band, seven readable scvd:// resources and two MCP Apps ui:// cards. https://scvd.store/mcp/verifier
    serves the same five verification handlers with no paid tool; https://scvd.store/mcp/docs serves the
    documentation resources and one read_docs tool. A stdio path exists through the provider's npm package
    scvd-mcp-starter (verifier only) or the documented mcp-remote bridge. A WebMCP script registers the
    same free instruments in the browser.
  humanURL: https://scvd.store/mcp.md
  baseURL: https://scvd.store/mcp
  tags:
  - MCP
  - Agent-Native
  - Agentic Commerce
  - x402
