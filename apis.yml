- aid: scvd-store:scvd-evidence-agent
  name: SCVD Evidence Agent (A2A)
  description: 'Agent2Agent protocol surface: an agent card served from https://scvd.store/.well-known/agent-card.json (and byte-identically at /.well-known/agent.json and /.well-known/a2a.json; protocolVersion
    0.3.0, JSONRPC, card version 1.1.0, provider Record Creative Co. LLC) advertising three free, read-only, no-account skills — preflight_endpoint, verify_receipt and get_endpoint_readiness — invoked as
    JSON task messages at https://scvd.store/a2a. Results are retrievable with tasks/get for 24 hours; streaming and push notifications are declared unsupported; securitySchemes is deliberately empty. The
    endpoint answers JSON-RPC 2.0 (tasks/get on an unknown id returns -32001 Task not found). Graded conformant against A2A 1.0.0. The paid instruments are x402 doors, never A2A tasks.'
  humanURL: https://scvd.store/a2a
  baseURL: https://scvd.store/a2a
