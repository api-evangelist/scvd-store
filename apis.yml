apis:
- aid: scvd-store:scvd-general-store-api
  name: SCVD General Store API
  description: 'The HTTP contract for scvd.store: 196 operations on 180 paths (OpenAPI 3.1.0, every operation with a unique operationId and summary) covering the free x402 instruments (POST /api/preflight/v1
    and /v2, /api/look/v1, /api/before-you-pay/v1, /api/conformance/v1, /api/a2a/check, /api/bot-auth/check, /api/onpage/v1, GET /api/verify/{id}), the 35 x402-paid doors at GET /api/buy/{item} (402 with
    PAYMENT-REQUIRED terms, Idempotency-Key on every one), the signed corpus and datasets (corpus.json, ledger, doors, fresh-set, defects, passports), purchase recovery and refunds, the reseller trade counter,
    and the discovery documents. Anonymous for free doors; a signed x402 v2 payment per call for paid doors; RFC 9457 problem objects; IETF RateLimit headers on the five metered doors; url-path versioning
    with an RFC 8594 sunset policy.'
