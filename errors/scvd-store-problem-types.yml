problem_types:
- status: 400
  title: Bad Request
  component: BadRequest
  occurrences: 196
  meaning: The request was malformed or a required parameter was missing.
  observed_codes: [url_missing]
  remediation: Fix the input; a validation refusal returns before any rate-limit bucket or payment is touched. On purchase doors a supplied invalid input receives a "field refusal instead of terms" and nothing is charged.
- status: 401
  title: Unauthorized
  occurrences: 4
  source_operations: [post_api_trade_sandbox_item_id, get_api_trade_partner_claim, get_api_trade_partner_statement, post_api_trade_partner_item_id]
  meaning: A trade-counter signing header is missing or wrong (codes missing_headers, bad_provider_key, bad_timestamp, bad_nonce, bad_signature per /api/trade/contract errors[]), or a knock on /admin (HTTP Basic, one human's).
  remediation: Send every header the dialect names (X-Trade-Key, X-Trade-Timestamp, X-Trade-Nonce, X-Trade-Signature) over timestamp.nonce.body; use POST /api/trade/sandbox/check to see every signature check reported by name.
- status: 402
  title: Payment Required
  occurrences: 39
  schema: PaymentRequiredChallenge
  headers: [PAYMENT-REQUIRED, WWW-Authenticate]
  meaning: 'The offer, not a failure: signable x402 v2 terms ride base64 in PAYMENT-REQUIRED and readably in the body; retry the same URL with PAYMENT-SIGNATURE (the v1 X-PAYMENT name is honoured). Over MCP: JSON-RPC error 402 with terms in error.data, retry with _meta[''x402/payment''].'
  remediation: Sign one of the accepts with a wallet holding USDC on that rail; echo idempotency.suggested_key as Idempotency-Key so a retry cannot double-charge. The stock @x402/core client refuses payments above $1 by default — 14 of 35 doors sit above it.
- status: 403
  title: Forbidden
  occurrences: 2
  source_operations: [get_api_buy_trust_profile, post_api_a2a_kits_kit_id_recheck]
  meaning: A hosted trust profile refused for the named host, or a recheck presented without the private purchase token.
- status: 404
  title: Not Found
  component: NotFound
  occurrences: 196
  meaning: No such resource. The body names where to look instead (observed on /api/verify with a one-minute propagation caveat).
  remediation: For a just-minted artifact id, retry in a minute before concluding anything; verification is free and unlimited.
- status: 409
  title: Conflict
  occurrences: 5
  source_operations: [post_api_trade_sandbox_item_id, get_api_trade_partner_claim, get_api_trade_partner_statement, post_api_trade_partner_item_id, get_corpus_sequence_evidence_host_json]
  meaning: A replayed trade nonce / order_ref, or a corpus evidence capture whose digest does not match the sealed row.
- status: 410
  title: Gone
  occurrences: 1
  source_operations: [post_api_a2a_kits_kit_id_recheck]
  meaning: The included A2A recheck window (30 days) has passed.
- status: 429
  title: Too Many Requests
  component: TooManyRequests / TooManyRequestsMetered
  occurrences: 196
  headers: [Retry-After, 'RateLimit-Limit / RateLimit-Remaining / RateLimit-Reset / RateLimit-Policy / RateLimit (metered doors only)']
  meaning: From the edge under abuse conditions on any route; from the store's own limiter on the five metered doors (30 probes per isolate per minute, 60 global). "A refused request is never charged for."
  remediation: Retry after Retry-After; on metered doors pace against RateLimit-Remaining rather than discovering the ceiling by being refused. See rate-limits/scvd-store-rate-limits.yml.
- status: 500
  title: Server Error
  component: ServerError
  occurrences: 196
  meaning: '"Something fell off a shelf. Nothing was charged."'
- status: 503
  title: Service Unavailable
  occurrences: 5
  source_operations: [get_api_purchase_status_purchase_id, post_api_trade_sandbox_item_id, post_api_trade_partner_item_id, post_api_a2a_kits_kit_id_recheck, get_corpus_sequence_evidence_host_json]
  observed_codes: [counter_closed, account_not_provisioned]
  meaning: The trade counter fails closed when its replay store is unreachable ("rather than risk honouring one instruction twice") or an account's secret is not yet provisioned; a purchase-status or evidence store is momentarily unavailable.
  remediation: '"Do not retry in a loop; the condition is ours to fix and the keeper is paged. Retry after a minute."'
- status: 304
  title: Not Modified
  component: NotModified
  occurrences: 84
  meaning: The ETag you sent still names these exact bytes. No body; every other header as the 200 would carry it. (Not an error; recorded because it is on 84 GET reads and matters to a polling agent.)
